<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي رقيب | ورقة الستاند</title><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#dde5d9;color:#124431;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}.editor{max-width:800px;margin:15px auto 20px;padding:15px;background:#fff;border-radius:13px;display:flex;gap:10px;flex-wrap:wrap}.editor label{font-size:13px;font-weight:700;flex:1}.editor input{display:block;width:100%;direction:ltr;text-align:left;margin-top:6px;padding:12px;border:1px solid #bacdbb;border-radius:7px;font:inherit}.editor button{border:0;border-radius:7px;padding:11px 19px;background:#16513d;color:white;font:inherit;cursor:pointer}.paper{background:#f8f7ef;width:210mm;min-height:297mm;position:relative;display:flex;flex-direction:column;align-items:center;padding:20mm 18mm 17mm;margin:auto;box-shadow:0 20px 60px #103b2b24;overflow:hidden;text-align:center}.paper:before{content:'';position:absolute;width:360mm;height:150mm;border-radius:50%;background:#e9f0e7;top:-95mm;left:-110mm;z-index:0}.paper>*{position:relative;z-index:1}.brand{font-size:19px;font-weight:700;color:#1a5440;letter-spacing:0;margin-top:2mm}.tag{font-size:12px;color:#6c8c77;letter-spacing:1px;margin-top:8mm}.paper h1{font-size:43px;line-height:1.4;color:#0c4835;margin:14mm 0 5mm}.paper h1 em{font-style:normal;color:#52916b}.sub{color:#577562;font-size:17px;line-height:1.8;margin:2mm 0 13mm}.qr-shell{display:flex;align-items:center;justify-content:center;padding:13mm;background:white;border:2px solid #bfceb7;border-radius:23px;min-height:79mm;min-width:79mm}.qr-shell canvas,.qr-shell img{display:block;width:60mm!important;height:60mm!important}.placeholder{width:60mm;height:60mm;border:2px dashed #bed4c0;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#66816c}.instructions{background:#104c39;color:#fff;padding:13px 24px;border-radius:30px;font-size:16px;font-weight:700;margin-top:12mm}.small{margin-top:7mm;font-size:14px;color:#577763}.foot{margin-top:auto;border-top:1px solid #c9d6c9;width:100%;padding-top:9mm;display:flex;justify-content:space-between;color:#688576;font-size:12px}#qrError{font-size:12px;color:#ac5046;margin-top:5px}@page{size:A4 portrait;margin:0}@media print{body{background:white}.editor{display:none}.paper{box-shadow:none;margin:0;width:210mm;height:297mm;min-height:297mm;break-after:avoid;page-break-after:avoid}#qrError{display:none}}@media screen and (max-width:820px){.paper{width:min(100%,210mm);min-height:100vh}.paper h1{font-size:37px}}</style></head><body><div class="editor"><label>بعد نشر الموقع، ضعي رابط GitHub Pages الحقيقي:<input type="url" id="url" placeholder="https://USERNAME.github.io/raqeeb-game/"></label><button id="make" type="button">إنشاء QR</button><button id="print" type="button">طباعة A4</button></div><div class="paper"><div class="brand">رقيب <span style="font-size:12px;font-weight:400">| المساعد الرقابي الميداني</span></div><div class="tag">RAQEEB · INTERACTIVE CHALLENGE</div><h1>هل أنت مستعد<br><em>للميدان؟</em></h1><p class="sub">10 بطاقات مخفية، وخلف كل بطاقة موقف مختلف.<br>اختر مهمتك، واتخذ قرارك!</p><div class="qr-shell"><div id="qr"><div class="placeholder">مكان رمز QR</div></div></div><div id="qrError" role="status"></div><div class="instructions">امسح الرمز وابدأ التحدّي</div><div class="small">تجربة قصيرة · بدون تحميل تطبيق</div><div class="foot"><span>مشروع من فريق LUB</span><span>@lupteam_</span></div></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const qr=document.getElementById('qr');document.getElementById('make').onclick=()=>{const v=document.getElementById('url').value.trim();try{const u=new URL(v);if(u.protocol!=='https:')throw Error('Bad URL');if(typeof QRCode==='undefined')throw Error('library');qr.replaceChildren();new QRCode(qr,{text:u.href,width:400,height:400,colorDark:'#103f32',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});document.getElementById('qrError').textContent='تم إنشاء الرمز. اختبره بهاتفك قبل الطباعة.'}catch(e){document.getElementById('qrError').textContent='أدخل رابط HTTPS صحيحًا وتأكد من الاتصال بالإنترنت.'}};document.getElementById('print').onclick=()=>{if(qr.querySelector('.placeholder')){alert('أنشئ QR أولًا بالرابط الحقيقي ثم اطبع.');return}window.print()};</script></body></html>
